<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="ArkDraw: the open-source diagram editor with an AI assistant">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#24243A"/></pattern>
    <linearGradient id="draw" gradientUnits="userSpaceOnUse" x1="258" y1="20" x2="490" y2="140"><stop offset="0" stop-color="#8A8DFF"/><stop offset="0.55" stop-color="#5B4BF5"/><stop offset="1" stop-color="#3A2BB8"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C7FFF"/><stop offset="0.55" stop-color="#5B4BF5"/><stop offset="1" stop-color="#3A2BB8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5B4BF5" stop-opacity="0.30"/><stop offset="1" stop-color="#5B4BF5" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0D0D14" stop-opacity="1"/><stop offset="0.48" stop-color="#0D0D14" stop-opacity="0.94"/><stop offset="0.63" stop-color="#0D0D14" stop-opacity="0"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#8F8BFF"/></marker>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="338" rx="28"/></clipPath>
    <style>
      .flow { stroke-dasharray: 7 7; animation: march 1.1s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -14; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="#0D0D14"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <ellipse cx="1020" cy="180" rx="340" ry="220" fill="url(#glow)"/>
    <rect width="1280" height="340" fill="url(#fade)"/>

    <!-- decorative diagram: shapes, orthogonal connectors, an animated "flow" edge, a selection -->
    <g fill="none" stroke="#8F8BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M968 104 H1046" marker-end="url(#arrow)"/>
      <path d="M1100 152 V214" marker-end="url(#arrow)"/>
      <path class="flow" d="M1034 262 H942" marker-end="url(#arrow)"/>
      <path d="M896 222 V146" marker-end="url(#arrow)"/>
    </g>
    <rect x="836" y="72" width="130" height="64" rx="14" fill="#171725" stroke="#3B3770" stroke-width="1.5"/>
    <rect x="856" y="94" width="70" height="8" rx="4" fill="#8F8BFF" opacity="0.85"/>
    <rect x="856" y="110" width="46" height="7" rx="3.5" fill="#2D2A55"/>
    <path d="M1100 58 L1146 104 L1100 150 L1054 104 Z" fill="#1D1A3A" stroke="#8F8BFF" stroke-width="2" stroke-linejoin="round"/>
    <rect x="1084" y="100" width="32" height="8" rx="4" fill="#8F8BFF" opacity="0.7"/>
    <rect x="1036" y="228" width="130" height="68" rx="14" fill="#171725" stroke="#3B3770" stroke-width="1.5"/>
    <rect x="1056" y="252" width="58" height="8" rx="4" fill="#8F8BFF" opacity="0.85"/>
    <rect x="1056" y="268" width="84" height="7" rx="3.5" fill="#2D2A55"/>
    <circle cx="896" cy="262" r="38" fill="url(#orb)"/>
    <path d="M881 262 H911 M896 247 V277" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <rect x="1028" y="220" width="146" height="84" rx="4" fill="none" stroke="#5B4BF5" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g fill="#171725" stroke="#5B4BF5" stroke-width="1.5">
      <rect x="1024" y="216" width="8" height="8" rx="2"/><rect x="1170" y="216" width="8" height="8" rx="2"/>
      <rect x="1024" y="300" width="8" height="8" rx="2"/><rect x="1170" y="300" width="8" height="8" rx="2"/>
    </g>
    <path d="M1180 300 V325 L1186.5 319 L1191 328.5 L1195 326.6 L1190.6 317.4 L1199.5 317.4 Z" fill="#F4F4FA" stroke="#0D0D14" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- app icon (app-icon.svg) -->
    <svg x="58" y="66" width="180" height="180" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="ic-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C7FFF"/><stop offset="0.55" stop-color="#5B4BF5"/><stop offset="1" stop-color="#3A2BB8"/></linearGradient>
      <linearGradient id="ic-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
      <filter id="ic-soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B0F6B" flood-opacity="0.35"/></filter>
    </defs>
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#ic-bg)"/>
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#ic-shine)"/>
    <g filter="url(#ic-soft)">
      <path d="M330 372 H512 V652 H694" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="196" y="272" width="268" height="200" rx="48" fill="#FFFFFF"/>
      <circle cx="694" cy="652" r="118" fill="#FFFFFF"/>
      <path d="M694 186 L790 282 L694 378 L598 282 Z" fill="#C9C5FF" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/>
    </g>
    </svg>

    <!-- wordmark: monoline paths, no font required -->
    <g transform="translate(262 50) scale(1.06)" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 94 L36 34 L62 94 M20 72 H52 M86 94 V54 M86 72 A18 18 0 0 1 104 54 H112 M134 34 V94 M168 54 L135 79 M147 70 L170 94" stroke="#F4F4FA"/>
      <g transform="translate(-70 0)"><path d="M264 34 H278 A30 30 0 0 1 278 94 H264 Z M330 94 V54 M330 72 A18 18 0 0 1 348 54 H356 M411 74 A20 20 0 1 1 411 73.99 M411 54 V94 M431 54 L442 94 L455 60 L468 94 L479 54" stroke="url(#draw)"/></g>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="263" y="222" font-size="24" font-weight="500" fill="#A3A3BD">The open-source diagram editor with an AI assistant.</text>
      <rect x="262" y="258" width="134" height="30" rx="15" fill="#1D1A3A"/><text x="329" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#BCB8FF">Desktop + Web</text>
      <rect x="406" y="258" width="124" height="30" rx="15" fill="#1D1A3A"/><text x="468" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#BCB8FF">Works offline</text>
      <rect x="540" y="258" width="130" height="30" rx="15" fill="#1D1A3A"/><text x="605" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#BCB8FF">AI assistant</text>
      <rect x="680" y="258" width="58" height="30" rx="15" fill="#1D1A3A"/><text x="709" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#BCB8FF">MIT</text>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="338" rx="28" fill="none" stroke="#26263C" stroke-width="2"/>
</svg>
