# Release pipeline: push a version tag (v1.2.3) and installers for every OS are
# built, checksummed and published as a GitHub Release.
#
#   prepare  → checks the tag matches the app version, creates a draft release
#   build    → macOS (universal DMG) and Linux x64/arm64 (AppImage, .deb, .rpm),
#              uploaded to the draft; Windows ships through the Microsoft Store
#              only (MSIX, signed by Microsoft, so no SmartScreen prompt)
#   snap     → optional snap package (best effort)
#   publish  → SHA256SUMS.txt, then the draft becomes a public release
#
# Signing is optional and driven by repository secrets (see docs/release.md):
# Apple Developer ID + notarization (APPLE_*) and updater signatures
# (TAURI_SIGNING_PRIVATE_KEY*). The Store signs the Windows package itself.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        id: version
        shell: bash
        run: |
          tag="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag $TAG doesn't match the app version. Bump package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml together."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "ArkDraw ${TAG#v}" --generate-notes $prerelease
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (Microsoft Store)
            os: windows-latest
            args: --no-bundle
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04 # oldest supported glibc → widest distro compatibility
            args: ''
          - name: Linux arm64
            os: ubuntu-22.04-arm
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils

      - run: npm ci

      # Vendor icon packs are downloaded at build time, not committed (public/icons/LICENSES.md).
      - name: Fetch icon packs
        run: npm run icons:fetch
        continue-on-error: true

      # ---- Optional signing (each block is skipped when its secrets are absent) ----

      - name: Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::APPLE_CERTIFICATE not set: the app will be ad-hoc signed and not notarized"
            exit 0
          fi
          # Only exported when present, so the bundler never sees empty values.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Updater signing
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY not set: no auto-update artifacts"
          fi

      # ---- Build and upload ----

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Windows builds the executable only (for the MSIX); nothing is attached to the release.
          releaseId: ${{ runner.os != 'Windows' && needs.prepare.outputs.release_id || '' }}
          tagName: ${{ runner.os != 'Windows' && env.TAG || '' }}
          includeUpdaterJson: ${{ runner.os != 'Windows' }}
          args: ${{ matrix.args }} ${{ runner.os != 'Windows' && steps.updater.outputs.args || '' }}

      # Microsoft Store package (MSIX). Needs the identity from Partner Center as
      # repository variables; the Store signs it, so Store installs have no SmartScreen
      # prompt. With the Store API secrets it is also submitted automatically.
      - name: MSIX for the Microsoft Store
        if: runner.os == 'Windows' && vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: node scripts/msix/build-msix.mjs --exe src-tauri/target/release/arkdraw.exe --out msix/ArkDraw.msix

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && vars.MSIX_IDENTITY_NAME != ''
        with:
          name: msix
          path: msix/ArkDraw.msix

      - name: Store API credentials
        id: store
        if: runner.os == 'Windows' && vars.MSIX_IDENTITY_NAME != '' && !contains(env.TAG, '-')
        shell: bash
        env:
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          if [ -n "$CLIENT_SECRET" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::MSSTORE_CLIENT_SECRET not set: MSIX built but not submitted"; fi

      - uses: microsoft/setup-msstore-cli@v1
        if: steps.store.outputs.ready == 'true'

      - name: Submit to the Microsoft Store
        if: steps.store.outputs.ready == 'true'
        shell: pwsh
        run: |
          msstore reconfigure --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" --sellerId "${{ secrets.MSSTORE_SELLER_ID }}" --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}"
          msstore publish msix/ArkDraw.msix --appId "${{ vars.MSSTORE_PRODUCT_ID }}"

  snap:
    name: Snap (best effort)
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: snapcore/action-build@v1
        id: snap
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.snap.outputs.snap }}" --clobber

  publish:
    name: Publish release
    needs: [prepare, build, snap]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Windows download: the Microsoft Store web installer, a small executable
      # signed by Microsoft that installs ArkDraw from the Store (no SmartScreen
      # prompt). It exists once the Store listing is live.
      - name: Windows installer (Microsoft Store)
        if: vars.MSSTORE_PRODUCT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          file="ArkDraw_${VERSION}_windows-installer.exe"
          code=$(curl -sL -o "$file" -w '%{http_code}' "https://get.microsoft.com/installer/download/${PRODUCT_ID}?cid=github_release")
          if [ "$code" = "200" ] && [ "$(head -c 2 "$file")" = "MZ" ]; then
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "::warning::Microsoft Store installer not available yet (HTTP $code); is the Store listing live?"
          fi

      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt latest.json
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="--latest"
          case "$TAG" in *-*) latest="--latest=false" ;; esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false $latest
