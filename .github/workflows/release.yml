# Release pipeline: push a version tag (v1.2.3) and installers for every OS are
# built, checksummed and published as a GitHub Release.
#
#   prepare  → checks the tag matches the app version, creates a draft release
#   build    → Windows (MSI + setup.exe + portable zip), macOS (universal DMG),
#              Linux x64 and arm64 (AppImage, .deb, .rpm); uploads to the draft
#   snap     → optional snap package (best effort)
#   publish  → SHA256SUMS.txt, then the draft becomes a public release
#
# Signing is optional and driven by repository secrets (see docs/release.md):
# Windows Authenticode (WINDOWS_CERTIFICATE*), Apple Developer ID + notarization
# (APPLE_*), and updater signatures (TAURI_SIGNING_PRIVATE_KEY*). Unsigned
# builds still work; users just see a SmartScreen / Gatekeeper warning.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        id: version
        shell: bash
        run: |
          tag="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag $TAG doesn't match the app version. Bump package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml together."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "OpenDraw ${TAG#v}" --generate-notes $prerelease
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ''
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04 # oldest supported glibc → widest distro compatibility
            args: ''
          - name: Linux arm64
            os: ubuntu-22.04-arm
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils

      - run: npm ci

      # Vendor icon packs are downloaded at build time, not committed (public/icons/LICENSES.md).
      - name: Fetch icon packs
        run: npm run icons:fetch
        continue-on-error: true

      # ---- Optional signing (each block is skipped when its secrets are absent) ----

      - name: Windows code signing certificate
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Output "::notice::WINDOWS_CERTIFICATE not set: installers will be unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5 -Compress
          $file = Join-Path $env:RUNNER_TEMP 'windows-signing.json'
          Set-Content -Path $file -Value $conf -Encoding utf8
          "args=--config $file" >> $env:GITHUB_OUTPUT

      - name: Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::APPLE_CERTIFICATE not set: the app will be ad-hoc signed and not notarized"
            exit 0
          fi
          # Only exported when present, so the bundler never sees empty values.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Updater signing
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY not set: no auto-update artifacts"
          fi

      # ---- Build and upload ----

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ env.TAG }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.wincert.outputs.args }} ${{ steps.updater.outputs.args }}

      # Portable Windows build: the executable in a zip, no installer (needs WebView2,
      # which ships with Windows 10 1803+ and 11).
      - name: Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $dir = "OpenDraw-$env:VERSION-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item src-tauri/target/release/opendraw.exe "$dir/OpenDraw.exe"
          Copy-Item LICENSE "$dir/LICENSE.txt"
          $zip = "OpenDraw_$($env:VERSION)_x64-portable.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force
          gh release upload $env:TAG $zip --clobber

      # Microsoft Store package (MSIX). Needs the identity from Partner Center as
      # repository variables; the Store signs it, so Store installs have no SmartScreen
      # prompt. With the Store API secrets it is also submitted automatically.
      - name: MSIX for the Microsoft Store
        if: runner.os == 'Windows' && vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: node scripts/msix/build-msix.mjs --exe src-tauri/target/release/opendraw.exe --out msix/OpenDraw.msix

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && vars.MSIX_IDENTITY_NAME != ''
        with:
          name: msix
          path: msix/OpenDraw.msix

      - name: Store API credentials
        id: store
        if: runner.os == 'Windows' && vars.MSIX_IDENTITY_NAME != '' && !contains(env.TAG, '-')
        shell: bash
        env:
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          if [ -n "$CLIENT_SECRET" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::MSSTORE_CLIENT_SECRET not set: MSIX built but not submitted"; fi

      - uses: microsoft/setup-msstore-cli@v1
        if: steps.store.outputs.ready == 'true'

      - name: Submit to the Microsoft Store
        if: steps.store.outputs.ready == 'true'
        shell: pwsh
        run: |
          msstore reconfigure --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" --sellerId "${{ secrets.MSSTORE_SELLER_ID }}" --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}"
          msstore publish msix/OpenDraw.msix --appId "${{ vars.MSSTORE_PRODUCT_ID }}"

  snap:
    name: Snap (best effort)
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: snapcore/action-build@v1
        id: snap
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.snap.outputs.snap }}" --clobber

  publish:
    name: Publish release
    needs: [prepare, build, snap]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt latest.json
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="--latest"
          case "$TAG" in *-*) latest="--latest=false" ;; esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false $latest

  # winget: opens the version-bump PR in microsoft/winget-pkgs for each stable
  # release (`winget install GabrielSantana.OpenDraw`). Needs WINGET_TOKEN, a classic
  # personal access token with the public_repo scope (forks and PRs on your behalf).
  winget:
    name: Update winget
    needs: [prepare, publish]
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - name: Check token
        id: token
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::WINGET_TOKEN not set: skipping the winget update"; fi
      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.token.outputs.ready == 'true'
        with:
          identifier: GabrielSantana.OpenDraw
          version: ${{ needs.prepare.outputs.version }}
          release-tag: ${{ env.TAG }}
          installers-regex: '_x64_en-US\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
