# Web deployment: push a version tag (v1.2.3) and the web editor
# (https://app.arkdraw.com) and the landing page (https://arkdraw.com, site/)
# are published to Cloudflare Workers, next to the desktop release (release.yml).
#
# Needs two repository secrets, set by a maintainer (never committed):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# Without them (e.g. in a fork) the job builds and skips the upload.
# Setup: docs/web.md#cloudflare-workers
name: Deploy web

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+'] # stable versions only, no pre-releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.arkdraw.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vendor icon packs are downloaded at build time, not committed (public/icons/LICENSES.md).
      - name: Fetch icon packs
        run: npm run icons:fetch

      - name: Build
        run: npm run build:web

      # Cloudflare's free plan allows 20,000 files per deployment and 25 MiB per file.
      - name: Check deployment limits
        run: |
          files=$(find dist -type f | wc -l)
          big=$(find dist -type f -size +25M | head -1)
          echo "dist: $files files"
          if [ "$files" -gt 20000 ]; then echo "::error::dist has $files files; Cloudflare allows 20,000"; exit 1; fi
          if [ -n "$big" ]; then echo "::error::$big is over 25 MiB"; exit 1; fi

      - name: Credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set: built, not deployed"
          fi

      - name: Deploy the editor (app.arkdraw.com)
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      # Static files, no build step.
      - name: Deploy the landing page (arkdraw.com)
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: site
          command: deploy
