[package]
name = "arkdraw"
version = "1.0.0"
description = "ArkDraw — an open-source, native desktop diagramming app"
authors = ["Gabriel Santana"]
license = "MIT"
repository = "https://github.com/gabe-santana/arkdraw"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "arkdraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
# AI assistant (src/ai.rs): OS keychain for BYOK keys + HTTPS client.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
url = "2"

# Auto-update from GitHub Releases (desktop only; see docs/release.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
