# ArkDraw web build on nginx (see docs/web.md).
#
# This is a template for the official nginx image: it is copied to
# /etc/nginx/templates/default.conf.template and rendered with envsubst at
# container start (${PORT}, ${FRAME_ANCESTORS}). __SCRIPT_HASHES__ is filled
# in at image build time by scripts/web/csp.mjs. The file lands in conf.d/,
# i.e. inside the `http {}` block.

# Cache policy by path: hashed build output is immutable; everything that
# decides *which* build runs (index.html, the service worker, the manifest)
# must always be revalidated.
map $uri $od_cache_control {
    default                         "no-cache";
    ~^/assets/                      "public, max-age=31536000, immutable";
    ~^/workbox-[A-Za-z0-9_-]+\.js$  "public, max-age=31536000, immutable";
    ~^/(icons|pwa)/                 "public, max-age=604800, stale-while-revalidate=86400";
    /favicon.svg                    "public, max-age=86400";
}

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- MIME types for files the stock mime.types doesn't know ------------
    # A types{} block replaces the inherited map, so re-include the stock one first.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json      webmanifest;
        application/x-arkdraw+json    arkdraw;
        application/vnd.jgraph.mxfile  drawio;
    }

    # --- Compression ---------------------------------------------------------
    # The image ships pre-compressed .gz siblings (gzip_static); dynamic gzip
    # covers anything else. For brotli, run behind a CDN or use an nginx build
    # with ngx_brotli and uncomment the block below (the Dockerfile can also
    # emit .br files — see docs/web.md).
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               image/svg+xml application/manifest+json application/x-arkdraw+json application/vnd.jgraph.mxfile;
    # brotli on;
    # brotli_static on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml application/javascript application/json application/xml
    #              image/svg+xml application/manifest+json application/x-arkdraw+json application/vnd.jgraph.mxfile;

    # --- Headers (inherited by every location below; none of them add their own)
    add_header Cache-Control $od_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # frame-ancestors (not X-Frame-Options) so ?embed=1 / ?lightbox=1 iframes work.
    # Restrict with FRAME_ANCESTORS="'self' https://wiki.example.com".
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __SCRIPT_HASHES__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors ${FRAME_ANCESTORS}" always;

    # Hashed build output: never fall back to index.html (a missing chunk must
    # 404, not return HTML with a JS MIME expectation).
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /icons/ {
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: every other path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
