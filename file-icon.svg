<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C7FFF"/>
      <stop offset="0.55" stop-color="#5B4BF5"/>
      <stop offset="1" stop-color="#3A2BB8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F0FB"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B0F6B" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B0F6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- The page, with its top-right corner folded. -->
  <g filter="url(#lift)">
    <path d="M216 40 H664 L872 248 V928 Q872 984 816 984 H216 Q160 984 160 928 V96 Q160 40 216 40 Z" fill="url(#paper)" stroke="#D9D6F2" stroke-width="8"/>
    <path d="M664 40 V200 Q664 248 712 248 H872 Z" fill="#DCD9F6" stroke="#D9D6F2" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <!-- The app icon, scaled into the page. -->
  <g transform="translate(256 424) scale(0.5714) translate(-64 -64)">
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#shine)"/>
    <g filter="url(#soft)">
      <path d="M330 372 H512 V652 H694" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="196" y="272" width="268" height="200" rx="48" fill="#FFFFFF"/>
      <circle cx="694" cy="652" r="118" fill="#FFFFFF"/>
      <path d="M694 186 L790 282 L694 378 L598 282 Z" fill="#C9C5FF" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
