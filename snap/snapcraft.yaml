# Snap package for OpenDraw (Tauri's bundler has no snap target).
# Builds the app with Tauri, then repackages the .deb into a strictly confined
# snap using the GNOME extension for WebKitGTK. Build locally with `snapcraft`
# (Ubuntu, LXD or Multipass) or in CI (.github/workflows/release.yml, job `snap`).
# See docs/release.md.
name: opendraw
base: core22
adopt-info: opendraw
summary: Open-source, offline, local-first diagram editor
description: |
  OpenDraw is an open-source, fully offline diagramming app for flowcharts,
  UML, ER diagrams and network maps. It opens and saves .drawio files and
  imports .vsdx drawings.
grade: stable
confinement: strict
license: MIT

apps:
  opendraw:
    command: usr/bin/opendraw
    desktop: usr/share/applications/opendraw.desktop
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      # AI provider calls (optional, user-configured) and update checks.
      - network

parts:
  opendraw:
    plugin: dump
    source: .
    build-snaps:
      - node/22/stable
      - rustup/latest/stable
    build-packages:
      - build-essential
      - curl
      - file
      - libwebkit2gtk-4.1-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libssl-dev
      - libxdo-dev
      - patchelf
      - dpkg
      - jq
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-pull: |
      craftctl default
      craftctl set version="$(jq -r .version src-tauri/tauri.conf.json)"
    override-build: |
      set -eu
      rustup default stable
      npm ci
      npm run icons:fetch || true
      npm run tauri build -- --bundles deb
      dpkg -x src-tauri/target/release/bundle/deb/*.deb "$CRAFT_PART_INSTALL/"
      # Normalise the binary and .desktop names (the deb uses the product name).
      cd "$CRAFT_PART_INSTALL/usr"
      bin="$(ls bin | head -n1)"
      [ "$bin" = opendraw ] || mv "bin/$bin" bin/opendraw
      desktop="$(ls share/applications/*.desktop | head -n1)"
      [ "$desktop" = share/applications/opendraw.desktop ] || mv "$desktop" share/applications/opendraw.desktop
      sed -i -e 's|^Exec=.*|Exec=opendraw %F|' \
             -e 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/opendraw.png|' \
             share/applications/opendraw.desktop
      icon="$(ls share/icons/hicolor/128x128/apps/*.png | head -n1)"
      [ "$icon" = share/icons/hicolor/128x128/apps/opendraw.png ] || cp "$icon" share/icons/hicolor/128x128/apps/opendraw.png
