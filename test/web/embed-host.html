<!doctype html>
<!--
  Manual test host for embed mode. With the dev server running open:
    http://localhost:1420/test/web/embed-host.html
  Messages from the editor are logged on the right and kept in window.__events.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ArkDraw embed host (test)</title>
    <style>
      body { margin: 0; display: grid; grid-template-columns: 1fr 320px; height: 100vh; font: 12px/1.4 system-ui, sans-serif; }
      iframe { width: 100%; height: 100%; border: 0; }
      aside { border-left: 1px solid #ddd; padding: 8px; overflow: auto; background: #fafafa; }
      button { margin: 0 4px 4px 0; }
      pre { white-space: pre-wrap; word-break: break-all; margin: 4px 0; padding: 4px; background: #fff; border: 1px solid #eee; }
      img { max-width: 100%; border: 1px solid #eee; }
    </style>
  </head>
  <body>
    <iframe id="editor" src="/?embed=1&autosave=1"></iframe>
    <aside>
      <div>
        <button id="load">Load sample</button>
        <button data-fmt="svg">Export SVG</button>
        <button data-fmt="png">Export PNG</button>
        <button data-fmt="json">Export JSON</button>
        <button data-fmt="drawio">Export .drawio</button>
        <button id="exit">Exit</button>
      </div>
      <div id="preview"></div>
      <div id="log"></div>
    </aside>
    <script>
      const frame = document.getElementById('editor');
      const SAMPLE = '<mxfile><diagram name="From host"><mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/>' +
        '<mxCell id="2" value="Embedded!" style="rounded=1;fillColor=#dae8fc;strokeColor=#6c8ebf;" vertex="1" parent="1"><mxGeometry x="40" y="40" width="160" height="70" as="geometry"/></mxCell>' +
        '<mxCell id="3" value="Second" style="ellipse;" vertex="1" parent="1"><mxGeometry x="320" y="40" width="120" height="70" as="geometry"/></mxCell>' +
        '<mxCell id="4" edge="1" source="2" target="3" parent="1"><mxGeometry relative="1" as="geometry"/></mxCell></root></mxGraphModel></diagram></mxfile>';
      window.__events = [];
      const send = (msg) => frame.contentWindow.postMessage(msg, location.origin);
      const log = (o) => {
        const pre = document.createElement('pre');
        pre.textContent = JSON.stringify(o);
        document.getElementById('log').prepend(pre);
      };
      window.addEventListener('message', (e) => {
        if (e.source !== frame.contentWindow) return;
        const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        const short = { ...d, json: d.json ? `${d.json.length} chars` : undefined, data: d.data ? `${String(d.data).slice(0, 40)}… (${String(d.data).length})` : undefined };
        window.__events.push({ origin: e.origin, wasString: typeof e.data === 'string', ...short });
        log(short);
        if (d.event === 'export' && /^data:image/.test(d.data)) document.getElementById('preview').innerHTML = `<img src="${d.data}">`;
      });
      document.getElementById('load').onclick = () => send({ action: 'load', xml: SAMPLE, title: 'Host doc' });
      document.getElementById('exit').onclick = () => send({ action: 'exit' });
      document.querySelectorAll('[data-fmt]').forEach((b) => (b.onclick = () => send({ action: 'export', format: b.dataset.fmt })));
      window.__send = send;
      window.__sample = SAMPLE;
    </script>
  </body>
</html>
